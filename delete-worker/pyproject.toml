[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doculyze-delete-worker"
version = "0.1.0"
description = "DocuLyze deletion worker: RabbitMQ consumer and idempotent resource cleanup"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["delete_worker*"]
