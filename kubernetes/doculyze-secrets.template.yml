# ──────────────────────────────────────────────────────────────
# TEMPLATE ONLY: safe to commit. Never put real values in this file.
#
# Workflow (Bitnami Sealed Secrets):
#
#   1. Copy this template to doculyze-secrets.raw.yml (gitignored)
#   2. Replace every <placeholder> under stringData with a real value
#   3. Seal it:
#        kubeseal --format yaml \
#          --controller-name sealed-secrets \
#          --controller-namespace kube-system \
#          < doculyze-secrets.raw.yml \
#          > doculyze-sealed-secrets.yml
#   4. Apply the SealedSecret:
#        kubectl apply -f doculyze-sealed-secrets.yml
#   5. Pods read the secret at start, so restart them:
#        kubectl -n development rollout restart deployment/doculyze-deployment
#   6. Delete doculyze-secrets.raw.yml and any downloaded key JSON.
#
#   The controller decrypts it into a regular Secret named
#   "doculyze-secrets" in the target namespace at runtime.
# ──────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: doculyze-secrets
  namespace: development
type: Opaque
stringData:
  # "private_key_id" from the Firebase service-account JSON
  FIREBASE_ADMIN_PRIVATE_KEY_ID: "<firebase-private-key-id>"
  # "private_key" from the same JSON (-----BEGIN PRIVATE KEY----- ... ).
  # Generate any encoding from a file, not via echo, to keep it out of shell history.
  FIREBASE_ADMIN_PRIVATE_KEY: "<firebase-private-key>"
  # e.g. amqp://user:password@rabbitmq:5672
  RABBITMQ_URL: "<rabbitmq-url>"
