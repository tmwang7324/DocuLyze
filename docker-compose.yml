services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: doculyze-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: doculyze
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-devpass}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP — localhost only
      - "127.0.0.1:15672:15672"   # management UI — localhost only
    networks: [ingest]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    # Pinned to match the pip client (issue #29) — server and client versions
    # move together or the API surface drifts under the tenant gateway.
    image: chromadb/chroma:1.5.9
    environment:
      IS_PERSISTENT: "TRUE"
      PERSIST_DIRECTORY: /data
    volumes:
      - chroma-data:/data
    networks: [ingest]      # no `ports:` — internal only
    # No healthcheck: the image ships no curl/wget/shell to probe
    # /api/v2/heartbeat with, so dependents wait on service_started.

  ingest-worker:
    build: ./ingest-worker
    environment:
      RABBITMQ_URL: amqp://doculyze:${RABBITMQ_PASS:-devpass}@rabbitmq:5672
      INGEST_QUEUE: doc.ingest
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET:-doculyze.firebasestorage.app}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/serviceAccount.json
      CHUNK_OUTPUT_DIR: /data/chunks
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      # The embedding pin — changing it is a full re-embed migration.
      EMBEDDING_MODEL: voyage-3.5-lite
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
    volumes:
      # Credentials are mounted, never baked into the image.
      - ./doculyze/serviceAccount.json:/run/secrets/serviceAccount.json:ro
      - chunk-output:/data/chunks
    networks: [ingest]      # no `ports:` — internal only
    depends_on:
      rabbitmq:
        condition: service_healthy
      chromadb:
        condition: service_started

volumes:
  chunk-output:
  chroma-data:

networks:
  ingest:
    driver: bridge
